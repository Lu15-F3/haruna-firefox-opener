<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #1e1e2e;
      color: #cdd6f4;
      padding: 20px;
      width: 320px;
    }
    h2 { color: #89b4fa; margin-top: 0; }
    .option-group { margin-bottom: 15px; }
    label { display: flex; align-items: center; cursor: pointer; font-size: 14px; }
    input[type="checkbox"] { margin-right: 10px; width: 16px; height: 16px; accent-color: #89b4fa; }
    .status { font-size: 12px; color: #a6e3a1; margin-top: 10px; display: none; }
  </style>
</head>
<body>
  <h2>Preferências do Haruna</h2>
  
  <div class="option-group">
    <label>
      <input type="checkbox" id="fullscreen">
      Sempre abrir em Tela Cheia
    </label>
  </div>

  <div class="option-group">
    <label>
      <input type="checkbox" id="closeTab">
      Fechar a aba após enviar o vídeo
    </label>
  </div>

  <div id="status" class="status">Configurações salvas!</div>

  <script src="options.js"></script>
</body>
</html>
